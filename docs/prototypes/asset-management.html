<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>故事管理台 · 素材与人物设定原型</title>
  <style>
    :root{--ink:#27221f;--muted:#786f69;--paper:#f5f0e8;--card:#fffdf8;--line:#ded5ca;--accent:#a44f34;--accent2:#d9a441;--dark:#252a32;--ok:#3f7b60}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{padding:28px 20px;color:#f7f0e5;background:var(--dark)}.brand{font:700 21px Georgia,serif;margin-bottom:35px}.side small{color:#9ca5b2}.nav{display:grid;gap:8px;margin-top:18px}.nav button{padding:11px 13px;text-align:left;color:#cbd0d8;border:0;border-radius:10px;background:transparent}.nav button.active{color:white;background:#ffffff16}.main{padding:25px 28px 40px;overflow:hidden}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.title h1{margin:0;font:700 28px Georgia,serif}.title p{margin:3px 0;color:var(--muted)}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:var(--card)}.btn.primary{border-color:var(--accent);color:white;background:var(--accent)}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{border:1px solid var(--line);border-radius:99px;padding:8px 14px;background:#fff9}.tabs .active{border-color:var(--accent);color:var(--accent);background:#fff}.workspace{display:grid;grid-template-columns:180px minmax(420px,1fr) 290px;gap:16px}.panel{border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 6px 24px #4b3c2b0b}.categories{padding:14px}.categories h3,.inspector h3{margin:5px 6px 12px}.cat{display:flex;justify-content:space-between;width:100%;padding:10px;border:0;border-radius:9px;background:transparent}.cat.active{color:var(--accent);background:#a44f3410}.viewer{padding:16px;min-width:0}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{width:70px;border:1px solid var(--line);border-radius:8px;padding:7px}.count{margin-left:auto;color:var(--muted)}.stage{position:relative;display:grid;place-items:center;height:390px;overflow:hidden;border-radius:13px;background:linear-gradient(145deg,#ece2d5,#d9c9b8)}.portrait{width:235px;height:330px;border-radius:110px 110px 20px 20px;display:grid;place-items:center;color:#fff;text-align:center;padding:25px;box-shadow:0 18px 40px #3b281c3b;background:var(--bg,linear-gradient(145deg,#7f3a31,#c38466))}.portrait .emoji{font-size:82px}.portrait b{display:block;font:700 22px Georgia,serif}.badge{position:absolute;left:14px;top:14px;padding:6px 10px;border-radius:99px;color:white;background:#27221fcc}.thumbs{display:flex;gap:10px;overflow:auto;padding:14px 2px 3px}.thumb{min-width:92px;height:78px;border:2px solid transparent;border-radius:10px;color:white;background:var(--bg);position:relative}.thumb.selected{border-color:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}.thumb span{position:absolute;left:5px;bottom:4px;padding:1px 5px;border-radius:9px;background:#0008}.inspector{padding:15px}.field{display:grid;gap:5px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:white}.setting{padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:#fff}.setting-head{display:flex;align-items:center;gap:8px}.setting-head b{flex:1}.ref{margin-top:7px;padding:6px 8px;border-radius:7px;color:#6b4c25;background:#f4e4c6}.add{width:100%;border:1px dashed #b7aaa0;border-radius:9px;padding:8px;background:transparent}.ai{display:none;margin-top:16px;padding:16px}.ai.show{display:block}.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.feature{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px}.ai-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.hint{color:var(--ok)}.toast{position:fixed;right:25px;bottom:25px;padding:11px 16px;border-radius:10px;color:white;background:#28231f;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.workspace{grid-template-columns:160px 1fr}.inspector{grid-column:1/-1}.app{grid-template-columns:170px 1fr}}@media(max-width:720px){.app{display:block}.side{display:none}.main{padding:15px}.workspace{display:block}.panel{margin-bottom:12px}.categories{display:flex;overflow:auto}.cat{min-width:130px}.stage{height:320px}.ai-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">STORY ATLAS</div><small>雾都怪盗系列</small><div class="nav"><button>管理概览</button><button>故事设定</button><button>人物档案</button><button class="active">素材管理</button><button>篇章编辑</button><button>AI 创作台</button></div></aside>
  <main class="main">
    <header class="top"><div class="title"><h1>人物素材工作台</h1><p>组织素材、完善人物设定，并组装 AI 参考上下文</p></div><div class="actions"><button class="btn" id="aiBtn">选择 AI 参考</button><button class="btn primary" id="uploadBtn">＋ 上传素材</button></div></header>
    <div class="tabs"><button class="active">素材视图</button><button>人物视图</button><button>生成记录</button></div>
    <section class="workspace">
      <aside class="panel categories"><h3>素材分类</h3><div id="cats"></div></aside>
      <section class="panel viewer">
        <div class="toolbar"><button class="btn" id="prev">←</button><label>序号 <input id="jump" type="number" min="1" value="1" /></label><button class="btn" id="go">跳转</button><button class="btn" id="next">→</button><span class="count" id="count"></span></div>
        <div class="stage" id="stage"><span class="badge" id="badge"></span><div class="portrait" id="portrait"><div><div class="emoji" id="emoji"></div><b id="assetName"></b><small id="assetNote"></small></div></div></div>
        <div class="thumbs" id="thumbs"></div>
      </section>
      <aside class="panel inspector"><h3>人物与设定</h3><div class="field"><label>人物编号</label><input value="CHAR-0007" readonly /></div><div class="field"><label>人物名称</label><input value="夜莺 · 伊芙琳" /></div><div class="field"><label>基础属性</label><input value="女性 · 24岁 · 人类 · 怪盗" /></div><h3>扩展设定</h3><div id="settings"></div><button class="add" id="addSetting">＋ 添加设定项</button></aside>
    </section>
    <section class="panel ai" id="aiPanel"><h3>本次 AI 人物生成参考</h3><p>勾选表示强约束；未勾选的特征交由 AI 自行决定。首次生成默认全选。</p><div class="ai-grid" id="features"></div><div class="ai-foot"><span class="hint" id="hint"></span><button class="btn primary" id="generate">生成基准人物图</button></div></section>
  </main>
</div><div class="toast" id="toast"></div><input id="file" type="file" accept="image/*" hidden />
<script>
const data={"人物表情":[{n:"自信微笑",e:"😏",c:"linear-gradient(145deg,#6f3145,#d67d82)",note:"行动成功时"},{n:"警觉",e:"🧐",c:"linear-gradient(145deg,#364861,#8294a8)",note:"察觉守卫"},{n:"惊讶",e:"😮",c:"linear-gradient(145deg,#705c42,#d7b36f)",note:"意外事件"}],"人物立绘":[{n:"怪盗基准立绘",e:"🕵️‍♀️",c:"linear-gradient(145deg,#24293c,#916573)",note:"首次人物基准"},{n:"屋顶姿态",e:"🏃‍♀️",c:"linear-gradient(145deg,#22395e,#8a78ad)",note:"夜间行动"}],"人物服装":[{n:"经典怪盗礼服",e:"🎩",c:"linear-gradient(145deg,#332943,#9d6a87)",note:"黑紫色礼服"},{n:"潜入服",e:"🥷",c:"linear-gradient(145deg,#202a32,#55726b)",note:"轻便潜行"}],"综合素材":[{n:"银色怀表",e:"🕰️",c:"linear-gradient(145deg,#5b6570,#c4b997)",note:"家族信物"}],"完整图片":[{n:"钟楼月夜 CG",e:"🌙",c:"linear-gradient(145deg,#172a4c,#a9758e)",note:"篇章一场景图"}]};
let cat="人物立绘",index=0; const settings=[{title:"帽子",ref:"经典怪盗礼服"},{title:"眼罩",ref:"黑羽眼罩"}]; const $=s=>document.querySelector(s);
function toast(t){$("#toast").textContent=t;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),1800)}
function renderCats(){$("#cats").innerHTML=Object.entries(data).map(([k,v])=>`<button class="cat ${k===cat?'active':''}" data-cat="${k}"><span>${k}</span><b>${v.length}</b></button>`).join('');document.querySelectorAll('.cat').forEach(x=>x.onclick=()=>{cat=x.dataset.cat;index=0;render()})}
function renderViewer(){const list=data[cat],a=list[index];$("#count").textContent=`${index+1} / ${list.length}`;$("#jump").value=index+1;$("#badge").textContent=cat;$("#portrait").style.setProperty('--bg',a.c);$("#emoji").textContent=a.e;$("#assetName").textContent=a.n;$("#assetNote").textContent=a.note;$("#prev").disabled=index===0;$("#next").disabled=index===list.length-1;$("#thumbs").innerHTML=list.map((x,i)=>`<button draggable="true" class="thumb ${i===index?'selected':''}" data-i="${i}" style="--bg:${x.c}" title="拖拽可调整顺序"><b>${x.e}</b><span>${i+1}</span></button>`).join('');document.querySelectorAll('.thumb').forEach(t=>{t.onclick=()=>{index=+t.dataset.i;renderViewer()};t.ondragstart=e=>e.dataTransfer.setData('text/plain',t.dataset.i);t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain'),to=+t.dataset.i;const [m]=list.splice(from,1);list.splice(to,0,m);index=to;render();toast(`已移动到位置 ${to+1}`)}});setTimeout(()=>document.querySelector('.thumb.selected')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),0)}
function renderSettings(){$("#settings").innerHTML=settings.map((s,i)=>`<div class="setting"><div class="setting-head"><input type="checkbox" checked><b>${s.title}</b><button class="btn" data-remove="${i}">×</button></div><div class="ref">参考素材：${s.ref}</div></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{settings.splice(+b.dataset.remove,1);renderSettings();renderFeatures()})}
function renderFeatures(){const base=['性别：女性','年龄：24岁','种族：人类','职业：怪盗'];const all=[...base,...settings.map(s=>`${s.title}：${s.ref}`)];$("#features").innerHTML=all.map((x,i)=>`<label class="feature"><input type="checkbox" checked data-feature><span><b>${x}</b><br><small>${i<4?'基础属性':'素材强约束'}</small></span></label>`).join('');document.querySelectorAll('[data-feature]').forEach(x=>x.onchange=updateHint);updateHint()}
function updateHint(){const all=[...document.querySelectorAll('[data-feature]')],n=all.filter(x=>x.checked).length;$("#hint").textContent=`已选择 ${n} 项约束，${all.length-n} 项交由 AI 决定`}
function render(){renderCats();renderViewer();renderSettings();renderFeatures()}
$("#prev").onclick=()=>{if(index>0){index--;renderViewer()}};$("#next").onclick=()=>{if(index<data[cat].length-1){index++;renderViewer()}};$("#go").onclick=()=>{const n=Number($("#jump").value);if(!Number.isInteger(n)||n<1||n>data[cat].length)return toast(`请输入 1-${data[cat].length} 的序号`);index=n-1;renderViewer()};$("#jump").onkeydown=e=>{if(e.key==='Enter')$("#go").click()};
$("#aiBtn").onclick=()=>{$("#aiPanel").classList.toggle('show');$("#aiPanel").scrollIntoView({behavior:'smooth'})};$("#uploadBtn").onclick=()=>$("#file").click();$("#file").onchange=e=>{if(!e.target.files[0])return;data[cat].push({n:e.target.files[0].name,e:'🖼️',c:'linear-gradient(145deg,#786956,#c7a97c)',note:'刚刚上传'});index=data[cat].length-1;render();toast('已上传并加入素材库（原型演示）')};
$("#addSetting").onclick=()=>{const title=prompt('请输入设定标题，例如：披风');if(!title)return;const ref=prompt('关联素材名称（也可以稍后上传）')||'尚未关联素材';settings.push({title,ref});renderSettings();renderFeatures()};$("#generate").onclick=()=>toast('已组装人物设定与参考素材（原型演示）');render();
</script>
</body></html>
